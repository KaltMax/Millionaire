name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (lint -> build -> test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint -w backend
      - name: Build
        run: npm run build -w backend
      - name: Test
        run: npm run test -w backend

  frontend:
    name: Frontend (lint -> build -> test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint -w frontend
      - name: Build
        run: npm run build -w frontend
      - name: Test
        run: npm run test -w frontend
